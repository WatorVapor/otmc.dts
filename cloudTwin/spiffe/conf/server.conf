server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  trust_domain = "spiffe.wator.xyz"
  data_dir     = "/run/spire/data"
  log_level    = "DEBUG"
  ca_ttl       = "87600h"  
}
plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "file:/run/spire/data/sqlite3.db?cache=shared&_journal=WAL"
    }
  }

  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }

  NodeAttestor "x509pop" {
    plugin_data {
      # CA 证书路径，用于验证节点的客户端证书
      ca_bundle_path = "/run/spire/ca/x509pop-ca-bundle.pem"
      
      # 可选配置：禁用特定签名算法
      # disable_sans = ["email", "uri"]
      
      # 可选配置：限制证书有效期（单位：秒）
      # max_validation_time = 300
      
      # 可选配置：允许的 SPIFFE ID 前缀
      # allowed_spiffe_ids = ["spiffe://spiffe.wator.xyz/production/*"]
    }
  }
  
  UpstreamAuthority "disk" {
    plugin_data {
      key_file_path      = "/run/spire/ca/upstream-intermediate-ca.key"
      cert_file_path     = "/run/spire/ca/upstream-intermediate-ca.crt"
      bundle_file_path   = "/run/spire/ca/upstream-root-ca.crt"
      ca_ttl = "87600h"  # 10年
    }
  }
}
