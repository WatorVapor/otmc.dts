services:
  dts-cloud-rustfs:
    image: rustfs/rustfs:1.0.0-beta.4
    container_name: dts-cloud-rustfs
    env_file:
      - .env_file
    volumes:
      - ./storage:/data
      - ./logs:/logs
    restart: unless-stopped
  dts-cloud-rustfs-nginx:
    image: nginx:stable-alpine
    container_name: dts-cloud-rustfs-nginx
    restart: unless-stopped
    volumes:
      - ./nginx-out/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-certs:/etc/nginx/ssl:ro
      - /dev/shm/:/dev/shm/
    ports:
      - '9000:9000'
      - '9001:9001'
