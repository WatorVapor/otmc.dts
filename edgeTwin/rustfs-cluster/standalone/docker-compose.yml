services:
  dts-rustfs:
    image: rustfs/rustfs:1.0.0-alpha.90
    container_name: dts-edge-rustfs
    env_file:
      - .env_file
      - .env_file_app_setup
    volumes:
      - /opt/dts/storage/rustfs:/data
      - ./logs:/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          memory: 64M 
  dts-rc:
    image: rustfs/rc:v0.1.8
    container_name: dts-edge-rc
    env_file:
      - .env_file
      - .env_file_app_setup
    volumes:
      - ./logs:/logs
    entrypoint: /bin/sh -c "tail -f /dev/null"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 64M
        reservations:
          memory: 32M 
  dts-nginx-out:
    image: nginx:stable-alpine
    container_name: dts-edge-nginx-out
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ./nginx-out/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/secure/dts/provision/buddy/keys/server.key.pem:/etc/nginx/ssl/server.key:ro
      - /opt/secure/dts/provision/buddy/ssl/server.crt:/etc/nginx/ssl/server.crt:ro
      - /opt/secure/dts/provision/buddy/ssl/rootca.crt:/etc/nginx/ssl/rootca.crt:ro
      - /dev/shm/:/dev/shm/
    ports:
      - '9000:9000'
      - '9001:9001'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 64M
        reservations:
          memory: 32M 
  dts-coredns:
    image: coredns/coredns:1.12.4
    container_name: dts-edge-coredns
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 64M
        reservations:
          memory: 32M 